<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeLink | Request Blood</title>
  <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/lib/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-droplet-fill"></i> LifeLink</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Find Donor</a></li>
          <li class="nav-item"><a class="nav-link" href="/register.html">Become a Donor</a></li>
          <li class="nav-item"><a class="nav-link active" href="/request.html">Request Blood</a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h5 class="mb-0"><i class="bi bi-megaphone text-danger"></i> Post an Emergency Blood Request</h5>
          </div>
          <div class="card-body">
            <form id="requestForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Patient name *</label>
                  <input name="patient_name" class="form-control" required minlength="2" maxlength="60">
                  <div class="invalid-feedback">Enter patient name.</div>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Blood group *</label>
                  <select name="blood_group" class="form-select" data-fill="groups" required>
                    <option value="">Select</option>
                  </select>
                  <div class="invalid-feedback">Required.</div>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Units *</label>
                  <input name="units" type="number" class="form-control" required min="1" max="10" value="1">
                  <div class="invalid-feedback">1 to 10.</div>
                </div>
                <div class="col-md-7">
                  <label class="form-label">Hospital *</label>
                  <input name="hospital" class="form-control" required minlength="3" maxlength="100">
                  <div class="invalid-feedback">Enter hospital name.</div>
                </div>
                <div class="col-md-5">
                  <label class="form-label">City *</label>
                  <select name="city" class="form-select" data-fill="cities" required>
                    <option value="">Select</option>
                  </select>
                  <div class="invalid-feedback">Select city.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Contact number *</label>
                  <input name="contact" class="form-control" required pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric">
                  <div class="invalid-feedback">Enter a valid 10 digit mobile number.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Urgency *</label>
                  <select name="urgency" class="form-select" required>
                    <option>Normal</option><option>Urgent</option><option>Critical</option>
                  </select>
                </div>
              </div>
              <button class="btn btn-brand w-100 mt-4"><i class="bi bi-send"></i> Post Request</button>
            </form>
            <div id="msg" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/forms.js"></script>
</body>
</html>
