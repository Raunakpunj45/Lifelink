<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeLink | Admin</title>
  <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/lib/icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/"><i class="bi bi-droplet-fill"></i> LifeLink</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Find Donor</a></li>
          <li class="nav-item"><a class="nav-link" href="/register.html">Become a Donor</a></li>
          <li class="nav-item"><a class="nav-link" href="/request.html">Request Blood</a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="/admin.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="login" class="card shadow-sm mx-auto" style="max-width:380px">
      <div class="card-body">
        <h5><i class="bi bi-lock"></i> Admin Login</h5>
        <form id="loginForm">
          <input id="key" type="password" class="form-control my-3" placeholder="Admin key" required>
          <button class="btn btn-brand w-100">Login</button>
        </form>
        <div id="loginMsg" class="mt-3"></div>
      </div>
    </div>

    <div id="panel" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <ul class="nav nav-pills">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabReq">Requests</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabDonors">Donors</button></li>
        </ul>
        <button id="logout" class="btn btn-outline-secondary btn-sm">Logout</button>
      </div>
      <div id="panelMsg" class="mb-3"></div>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabReq">
          <div class="table-responsive card shadow-sm">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr><th>#</th><th>Patient</th><th>Group</th><th>Units</th><th>Hospital</th><th>Urgency</th><th>Posted</th><th>Status</th></tr>
              </thead>
              <tbody id="reqRows"></tbody>
            </table>
          </div>
        </div>

        <div class="tab-pane fade" id="tabDonors">
          <div class="d-flex flex-wrap gap-2 mb-3">
            <select id="fGroup" class="form-select w-auto" data-fill="groups"><option value="">All groups</option></select>
            <select id="fCity" class="form-select w-auto" data-fill="cities"><option value="">All cities</option></select>
            <a class="btn btn-outline-success ms-auto" href="/api/export/donors.csv"><i class="bi bi-download"></i> Donors CSV</a>
            <a class="btn btn-outline-success" href="/api/export/requests.csv"><i class="bi bi-download"></i> Requests CSV</a>
          </div>
          <div class="table-responsive card shadow-sm">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr><th>#</th><th>Name</th><th>Group</th><th>City</th><th>Phone</th><th>Last donation</th><th>Eligible</th><th>Available</th><th></th></tr>
              </thead>
              <tbody id="donorRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body">Delete donor <b id="delName"></b>? This cannot be undone.</div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button id="confirmDelete" class="btn btn-danger btn-sm">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast text-bg-success"><div class="toast-body" id="toastText"></div></div>
  </div>

  <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
